[project]
name = "polyrl-brain"
version = "0.0.0"
description = "RL brain for PolyRL (tmrl for PolyTrack)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "websockets>=13",
    "pyyaml>=6",
    "rich>=13",
    "tensorboard>=2.17",
    "stable-baselines3>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
